[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advent-of-code"
version = "0.1.0"
description = "Advent of Code puzzles with Python and Go"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1,<3.0.0",
    "scipy>=1.18.0,<2.0.0",
]

[project.urls]
Homepage = "https://adventofcode.com/"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.15.22,<0.16.0",
]

[tool.setuptools.packages.find]
include = ["cmd*", "internal.py*", "y2023*", "y2024*"]
namespaces = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]
